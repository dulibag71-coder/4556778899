name: GitHub Pages 배포

on:
  push:
    branches: [main]      # main 브랜치에 push 될 때 자동 실행
  workflow_dispatch:       # GitHub 웹에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: golf-app/package-lock.json

      - name: 패키지 설치
        run: npm ci
        working-directory: golf-app

      - name: 빌드
        run: npm run build
        working-directory: golf-app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: golf-app/dist

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
